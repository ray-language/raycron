# raycron CI: every pull request and every push to master checks the formatting and runs the
# test suite on the VM and as native binaries, with the raylang release pinned in ray.toml
# (.github/actions/setup-ray). Zone tests skip on Windows, which has no zoneinfo database.
name: ci

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Notifications go to a trace instead of the runner's (missing) desktop.
  RAY_UI_BACKEND: headless

jobs:
  format:
    name: ray fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and the pinned raylang
        uses: ./.github/actions/setup-ray
        with:
          target: x86_64-unknown-linux-gnu
      # `ray fmt` prints the canonical version: any difference is an unformatted file.
      - name: Check that every source is formatted
        shell: bash
        run: |
          status=0
          for f in src/*.ray tests/*.ray; do
            if ! ray fmt "$f" | diff -u "$f" - >/dev/null; then
              echo "::error file=$f::not formatted (run: ray fmt -w $f)"
              status=1
            fi
          done
          exit $status

  test:
    name: test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: macos-14,       target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust and the pinned raylang
        uses: ./.github/actions/setup-ray
        with:
          target: ${{ matrix.target }}
      - name: Fetch the dependencies
        run: ray fetch
      - name: Tests (VM)
        shell: bash
        run: ray test
      # raycron runs as a native daemon: the suite also runs compiled.
      - name: Tests (native)
        shell: bash
        run: ray test --native
